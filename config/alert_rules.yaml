alerts:
  - name: ChatLatencyP95High
    severity: warning
    condition: response_sent latency_p95_ms > 3000 for 10m
    type: symptom-based
    owner: dashboard-slo
    runbook: docs/alerts.md#alert-1
  - name: ChatErrorRateHigh
    severity: critical
    condition: request_failed / request_received error_rate_pct > 2 for 5m
    type: symptom-based
    owner: api-oncall
    runbook: docs/alerts.md#alert-2
  - name: ChatQualityDegraded
    severity: warning
    condition: response_sent quality_score_avg < 0.75 for 15m
    type: symptom-based
    owner: ai-quality
    runbook: docs/alerts.md#alert-3
